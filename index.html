<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be My Valentine? 💖</title>

<style>
:root {
    --bg-light: #b11226; /* cherry red */
    --bg-dark: #0b1c2d;  /* midnight blue */
    --card-light: rgba(255,255,255,0.18);
    --card-dark: rgba(0,0,0,0.45);
    --text-light: #ffffff;
    --text-dark: #eaeaea;
    --code-light: rgba(0,0,0,0.4);
    --code-dark: rgba(0,0,0,0.6);
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Times New Roman", monospace;
    background: var(--bg-light);
    color: var(--text-light);
    overflow: hidden;
    transition: background 0.5s, color 0.5s;
}

body.dark {
    background: var(--bg-dark);
    color: var(--text-dark);
}

.container {
    background: var(--card-light);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 20px;
    width: 90%;
    max-width: 600px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: fadeIn 1.2s ease;
}

body.dark .container {
    background: var(--card-dark);
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 { font-size: 26px; margin-bottom: 10px; }
h2 { font-size: 18px; }

.code-box {
    background: var(--code-light);
    border-radius: 10px;
    padding: 15px;
    margin: 20px 0;
    font-size: 14px;
    min-height: 130px;
    text-align: left;
    white-space: pre-line;
}

body.dark .code-box {
    background: var(--code-dark);
}

button {
    padding: 12px 22px;
    border-radius: 25px;
    border: none;
    font-size: 16px;
    margin: 8px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}

.yes {
    background: #00ff9c;
    color: #003d2b;
    font-weight: bold;
}

.no {
    background: #ff4b5c;
    color: white;
}

.toggle, .music {
    position: absolute;
    top: 15px;
    border: none;
    border-radius: 50%;
    padding: 10px 12px;
    cursor: pointer;
    font-size: 16px;
    background: rgba(255,255,255,0.25);
}

.toggle { right: 15px; }
.music { left: 15px; }

.heart {
    position: absolute;
    animation: floatUp linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    from { transform: translateY(100vh) scale(0.6); opacity: 0; }
    50% { opacity: 1; }
    to { transform: translateY(-10vh) scale(1.2); opacity: 0; }
}
</style>
</head>

<body>

<!-- Music toggle -->
<button class="music" onclick="toggleMusic()">🎵</button>
<!-- Dark/light mode toggle -->
<button class="toggle" onclick="toggleMode()">🌙</button>

<!-- Background music -->
<audio id="bgMusic" loop>
    <source src="iwannabeyours.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <h1>💖 Haiiii, My Cutie Babyyyyy 💖</h1>
    <div class="code-box" id="codeBox"></div>
    <h2>Will the love of my life please be my Valentine? 💕</h2>
    <button class="yes" onclick="yesClicked()">Yes 💘</button>
    <button class="no" onclick="noClicked()">No 😢</button>
</div>

<script>
// Typing code animation
const codeText = [
    "Initializing love.exe...",
    "Loading horniness...",
    "Importing memories...",
    "",
    "def love(you, me):",
    "    while True:",
    "        flirting = infinity",
    "        being_downbad = infinity",
    "        being_your_good_boy = love",
    "",
    "print('You are my everything ❤️')",
    "",
    "System Output:",
    "Will you be my Valentine? 💕"
];

let l = 0, c = 0;
const box = document.getElementById("codeBox");

function typeEffect() {
    if (l < codeText.length) {
        if (c < codeText[l].length) {
            box.innerHTML += codeText[l][c++];
            setTimeout(typeEffect, 35);
        } else {
            box.innerHTML += "\n";
            l++; c = 0;
            setTimeout(typeEffect, 250);
        }
    }
}
typeEffect();

// Dark/light mode
function toggleMode() {
    document.body.classList.toggle("dark");
    document.querySelector(".toggle").textContent =
        document.body.classList.contains("dark") ? "☀️" : "🌙";
}

// Background music
const music = document.getElementById("bgMusic");
function toggleMusic() {
    if (music.paused) {
        music.volume = 0;
        music.play();
        let v = 0;
        const fade = setInterval(() => {
            if (v < 0.8) {
                v += 0.05;
                music.volume = v;
            } else {
                clearInterval(fade);
            }
        }, 200);
    } else {
        music.pause();
    }
}

// YES button → confetti + message
function yesClicked() {
    launchConfetti();
    setTimeout(() => {
        document.body.innerHTML = `
            <div style="text-align:center;padding:40px;color:white;">
                <h1>💖 MY NEHA KHAN SAID YESSSS 💖</h1>
                <h2>SHE'S MINEEEEE HEHEHEHE</h2>
                <p>I'll always be your good boy, Mommy.<br>
                Mwah, I LOVE YOU SOOOO MUCHHH.</p>
            </div>
        `;
    }, 1800);
}

// NO button cheeky
function noClicked() {
    alert("Nice try. Press YES 😘");
}

// Floating hearts animation
function createHeart() {
    const h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "❤️";
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = Math.random() * 18 + 12 + "px";
    h.style.animationDuration = Math.random() * 3 + 4 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
}
setInterval(createHeart, 350);

// HEART-SHAPED CONFETTI WITH SIDE BURSTS
function launchConfetti() {
    const colors = ["#ff4b5c","#ff758c","#ff9aa2","#ffd1dc","#ffffff"];
    function createPiece(x, y, fromSide=false){
        const conf = document.createElement("div");
        conf.innerHTML = "❤️";
        conf.style.position = "fixed";
        conf.style.left = x + "px";
        conf.style.top = y + "px";
        conf.style.fontSize = Math.random()*18+14 + "px";
        conf.style.color = colors[Math.floor(Math.random()*colors.length)];
        conf.style.pointerEvents = "none";
        conf.style.zIndex = 9999;

        document.body.appendChild(conf);

        const angle = fromSide ? (x<window.innerWidth/2 ? Math.random()*40-20 : Math.random()*-40+20) : Math.random()*360;
        const velocityX = fromSide ? (x<window.innerWidth/2 ? Math.random()*6+4 : -(Math.random()*6+4)) : Math.random()*6-3;
        const velocityY = Math.random()*-8-6;
        const rotation = Math.random()*720;

        conf.animate([
            { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
            { transform: `translate(${velocityX*40}px, ${window.innerHeight}px) rotate(${rotation}deg)`, opacity: 0 }
        ], { duration: Math.random()*1500+2500, easing:"ease-out" });

        setTimeout(()=>conf.remove(),4000);
    }

    // center rain
    for(let i=0;i<120;i++){
        createPiece(Math.random()*window.innerWidth, Math.random()*window.innerHeight/2);
    }
    // left burst
    for(let i=0;i<80;i++){
        createPiece(0, window.innerHeight/2,true);
    }
    // right burst
    for(let i=0;i<80;i++){
        createPiece(window.innerWidth, window.innerHeight/2,true);
    }
}
</script>

</body>
</html>
